<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DAMA</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; overflow: hidden; background: #090b12; position: fixed; inset: 0; overscroll-behavior: none; }
  #game-canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; min-width: 100%; min-height: 100%; }
  #status {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #e8b860; font: bold 16px Arial, sans-serif; font-family: Arial, sans-serif;
    z-index: 10;
  }
</style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="status">Loading Python runtime...</div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
